# Training configuration for Hanabi with Temporal KL Regularization

# Environment settings
env:
  num_players: 2
  hand_size: 5
  num_colors: 5
  num_ranks: 5
  max_hint_tokens: 8
  max_life_tokens: 3

# Model settings  
model:
  hidden_dim: 512
  num_lstm_layers: 2
  pretrained_model: "cross-encoder/ms-marco-TinyBERT-L-2-v2"
  freeze_bert: false

# RL settings
rl:
  gamma: 0.99
  multi_step: 1
  
# Temporal KL regularization - THE KEY HYPERPARAMETER FOR YOUR ABLATION
temporal_reg_lambda: 0.01  # Try: 0.0, 0.001, 0.01, 0.1, 1.0

# Training settings
training:
  num_epochs: 1000
  epoch_len: 20          # Reduced for faster CPU training
  batch_size: 16         # Reduced for CPU
  lr: 6.25e-5
  eps: 1.5e-5
  grad_clip: 5.0
  target_sync_freq: 50
  
# Replay buffer settings
replay:
  buffer_size: 5000
  burn_in_frames: 100    # Reduced for faster startup
  
# Data collection
collect:
  num_games_per_epoch: 5   # Reduced for faster CPU training
  epsilon_start: 1.0
  epsilon_end: 0.1
  epsilon_decay_epochs: 500

# Logging
logging:
  save_dir: "experiments"
  log_freq: 10
  save_freq: 50
  use_wandb: false
  wandb_project: "hanabi-temporal-kl"

# Device
device: "auto"  # "auto" will detect, or use "cpu" / "cuda" explicitly
seed: 42
